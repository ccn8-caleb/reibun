# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

# Branches: feature branches → development (checked, not deployed) → master (deployed).
on:
  push:
    branches: ["master", "development"]

  # Pull requests into either branch run the checks only
  pull_request:
    branches: ["master", "development"]

  # Manual runs (Actions tab); they only deploy when run on master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Validate the starter data before anything ships
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so there is no go.sum to cache
      - name: Go checks
        run: |
          test -z "$(gofmt -l tools)" || { gofmt -l tools; echo "::error::gofmt needed"; exit 1; }
          go vet ./tools/reibun
      - name: Lint sample sentences
        run: go run ./tools/reibun lint
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The engine tests run the real tokenizer, so they need its dictionary.
      - name: Fetch tokenizer dictionary
        run: go run ./tools/reibun kuromoji fetch
      - name: Engine tests
        run: node --test tests/*.test.mjs
      - name: Check changelog has the app version
        run: |
          ver=$(sed -nE "s/^export const APP_VERSION = '([^']+)';/\1/p" site/js/core/version.js)
          echo "APP_VERSION=$ver"
          grep -q "^## \[$ver\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$ver]' entry"; exit 1; }

  # Package site/ as the Pages artifact
  build:
    needs: lint
    # Only master is ever built and deployed; development and PRs stop after lint.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Tokenizer dictionary: kuromoji's IPADIC, pinned and checksummed.
      - name: Fetch tokenizer dictionary
        run: go run ./tools/reibun kuromoji fetch
      # Dictionary: latest JMdict (English) from jmdict-simplified, split into
      # one small file per first character under site/dict/.
      - name: Build dictionary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/jmdict"
          gh release download --repo scriptin/jmdict-simplified --pattern 'jmdict-eng-[0-9]*.json.tgz' --dir "$RUNNER_TEMP/jmdict"
          tar -xzf "$RUNNER_TEMP"/jmdict/*.tgz -C "$RUNNER_TEMP/jmdict"
          go run ./tools/reibun dict build "$RUNNER_TEMP"/jmdict/jmdict-eng-*.json site/dict
      # Versioned asset URLs (so Cloudflare/browsers never mix two deploys) and the
      # service worker's version + offline precache list. See tools/stamp-deploy.sh.
      - name: Stamp deploy
        run: tools/stamp-deploy.sh site "${GITHUB_SHA::12}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

  # Deploy in its own job: deploy-pages can miss an artifact uploaded moments
  # earlier in the same job (actions/deploy-pages#451). Separate jobs give the
  # artifact time to become listable, and if the lookup still fails,
  # "Re-run failed jobs" retries only this job without uploading a duplicate.
  deploy:
    needs: build
    # One deployment at a time; never cancel one that's in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
