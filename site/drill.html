<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>★ドリル | 例文 Reibun</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="例文">
  <script>document.documentElement.dataset.theme = localStorage.getItem('reibun_theme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/pages/drill.js"></script>
</head>
<body>

  <header id="top-bar">
    <div class="brand-group">
      <img class="brand-badge" src="icon.svg" alt="">
      <span class="brand-title" data-ja="例文" data-en="Reibun" data-tip-ja="文を分解して読み解く" data-tip-en="Break sentences down">例文</span>
      <div id="nexus-hub-slot"></div>
    </div>
    <div id="nexus-hub-controls"></div>
  </header>

  <main class="page dr-page">
    <section class="card dr-setup" id="dr-setup">
      <div class="dr-row">
        <span class="dr-label" data-ja="問題" data-en="Questions from"></span>
        <div class="toggle-group" id="dr-sources" role="radiogroup"></div>
      </div>
      <div class="dr-row" id="dr-levels-row">
        <span class="dr-label" data-ja="レベル" data-en="Level"></span>
        <div class="toggle-group" id="dr-levels"></div>
      </div>
      <div class="dr-row">
        <span class="dr-label" data-ja="答え方" data-en="Answer"></span>
        <div class="toggle-group" id="dr-modes" role="radiogroup"></div>
      </div>
      <div class="bd-input-row">
        <button type="button" class="tb-btn primary" id="dr-start"><span data-icon="drill"></span><span data-ja="始める（10問）" data-en="Start (10 questions)">始める（10問）</span></button>
        <span class="bd-status" id="dr-status" role="status"></span>
      </div>
    </section>

    <section class="card dr-question" id="dr-question" hidden aria-live="polite"></section>
  </main>

</body>
</html>
