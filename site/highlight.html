<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>読解 | 例文 Reibun</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="例文">
  <script>document.documentElement.dataset.theme = localStorage.getItem('reibun_theme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/pages/highlight.js"></script>
</head>
<body>

  <header id="top-bar">
    <div class="brand-group">
      <img class="brand-badge" src="icon.svg" alt="">
      <span class="brand-title" data-ja="例文" data-en="Reibun" data-tip-ja="文を分解して読み解く" data-tip-en="Break sentences down">例文</span>
      <div id="nexus-hub-slot"></div>
    </div>
    <div id="nexus-hub-controls"></div>
  </header>

  <main class="page hl-page">
    <section class="card bd-input" id="hl-input-card">
      <textarea id="hl-text" lang="ja" rows="4" spellcheck="false" autocomplete="off"
        data-placeholder-ja="読みたい文章を貼り付け" data-placeholder-en="Paste a passage to read"></textarea>
      <div class="bd-input-row">
        <button type="button" id="hl-start" class="tb-btn primary"><span data-icon="highlighter"></span><span data-ja="読む" data-en="Read">読む</span></button>
        <span id="hl-status" class="bd-status" role="status"></span>
      </div>
      <div class="bd-examples" id="hl-samples"></div>
    </section>

    <section class="hl-reader" id="hl-reader" hidden>
      <div class="hl-toolbar">
        <div class="hl-pens" id="hl-pens" role="radiogroup" aria-label="Pen"></div>
        <span class="spacer"></span>
        <button type="button" class="chip" id="hl-furigana" data-ja="ふりがな" data-en="Furigana">ふりがな</button>
        <button type="button" class="chip" id="hl-reveal" data-ja="Reibunの印" data-en="Reibun's marks">Reibunの印</button>
      </div>
      <p class="panel-hint" id="hl-help"></p>
      <article class="card hl-passage" id="hl-passage" lang="ja"></article>
      <div class="hl-actions">
        <button type="button" class="tb-btn primary" id="hl-check"><span data-icon="check"></span><span data-ja="チェック" data-en="Check">チェック</span></button>
        <button type="button" class="tb-btn" id="hl-edit"><span data-icon="edit"></span><span data-ja="文章を変える" data-en="Change passage">文章を変える</span></button>
        <button type="button" class="tb-btn" id="hl-clear"><span data-icon="eraser"></span><span data-ja="印を全部消す" data-en="Clear marks">印を全部消す</span></button>
      </div>
      <section class="card hl-feedback" id="hl-feedback" hidden aria-live="polite"></section>
      <section class="card rc" id="rc" hidden aria-live="polite"></section>
    </section>
  </main>

</body>
</html>
